<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM MIS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky selector bar styled like the workbook's yellow input cells, then KPI tiles, two chart panels and the scorecard. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e9eeec;
  --ink: #15211f;
  --ink-2: #4b5a57;
  --line: #d5dcda;
  --accent: #0f6b62;
  --accent-soft: #d6ebe7;
  --cell: #fff3b0;
  --cell-line: #d9be3a;
  --good: #1f7a3f;
  --warn: #b26b00;
  --bad: #b3261e;
  --muted-bar: #b9c6c3;
  --font-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
  --glass: rgba(255, 255, 255, .74);
  --glass-strong: rgba(255, 255, 255, .9);
  --glass-line: rgba(21, 33, 31, .12);
  --glow: rgba(15, 107, 98, .28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --surface: #172120; --surface-2: #1f2c2a; --ink: #e5ecea; --ink-2: #9fb0ac; --line: #2c3b38;
    --accent: #4fc1b1; --accent-soft: #19403b; --cell: #3b3412; --cell-line: #8f7a1d;
    --good: #5ccf84; --warn: #f0a63a; --bad: #ff7b6e; --muted-bar: #3c4d4a; --glass: rgba(20, 30, 29, .62); --glass-strong: rgba(18, 27, 26, .86); --glass-line: rgba(160, 220, 210, .14); --glow: rgba(79, 193, 177, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --surface: #172120; --surface-2: #1f2c2a; --ink: #e5ecea; --ink-2: #9fb0ac; --line: #2c3b38;
  --accent: #4fc1b1; --accent-soft: #19403b; --cell: #3b3412; --cell-line: #8f7a1d;
  --good: #5ccf84; --warn: #f0a63a; --bad: #ff7b6e; --muted-bar: #3c4d4a; --glass: rgba(20, 30, 29, .62); --glass-strong: rgba(18, 27, 26, .86); --glass-line: rgba(160, 220, 210, .14); --glow: rgba(79, 193, 177, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
.veil { position: fixed; inset: 0; z-index: 0; pointer-events: none; background:
  radial-gradient(ellipse 80% 60% at 50% 0%, transparent 0%, transparent 55%, var(--bg) 120%),
  linear-gradient(180deg, transparent 0%, transparent 40%, color-mix(in srgb, var(--bg) 55%, transparent) 100%); }
main { position: relative; z-index: 1; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Selector bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass); border-bottom: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding-block: 10px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.field select { background: var(--cell); border: 1px solid var(--cell-line); border-radius: 3px; padding: 6px 28px 6px 8px; font-weight: 600; max-width: 100%; }
.field.file select { min-width: min(320px, 100%); }
.spacer { flex: 1 1 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: var(--radius); }
.tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Header */
.head { padding-block: 44px 18px; display: grid; gap: 8px; text-shadow: 0 1px 18px var(--bg); }
.head h1 { background: linear-gradient(100deg, var(--ink) 0%, var(--ink) 40%, var(--accent) 50%, var(--ink) 60%, var(--ink) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 9s ease-in-out infinite; text-shadow: none; }
@keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
.scene-cap { display: inline-flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; font-size: 12px; color: var(--ink-2); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 4px 12px 4px 8px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); text-shadow: none; }
.scene-cap i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--glow); animation: ping 2s ease-out infinite; flex: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--glow); } 100% { box-shadow: 0 0 0 10px transparent; } }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.head h1 { font-size: clamp(24px, 4vw, 42px); font-stretch: 85%; font-weight: 800; letter-spacing: -.01em; }
.head p { margin: 0; color: var(--ink-2); max-width: 90ch; }
.showing { font-family: var(--font-num); font-size: 13px; color: var(--ink-2); }

section { padding-block: 14px; }
.section-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
.section-title h2 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.section-title span { color: var(--ink-2); font-size: 13px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 10px; }
.kpi { position: relative; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px)); transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; will-change: transform; border-radius: var(--radius); padding: 12px 12px 10px 15px; display: grid; gap: 4px; text-align: left; cursor: pointer; min-width: 0; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: var(--radius) 0 0 var(--radius); background: var(--muted-bar); }
.kpi[data-state="good"]::before { background: var(--good); }
.kpi[data-state="warn"]::before { background: var(--warn); }
.kpi[data-state="bad"]::before { background: var(--bad); }
.kpi:hover { --lift: -3px; box-shadow: 0 12px 30px -12px var(--glow); }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 14px 40px -14px var(--glow); }
.kpi::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 60%); opacity: 0; transition: opacity .3s; }
.kpi:hover::after { opacity: .55; }
.kpi .lab { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.kpi .val { font-family: var(--font-num); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .unit { font-size: 12px; color: var(--ink-2); font-family: var(--font-ui); font-weight: 500; margin-left: 4px; }
.kpi .sub { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.kpi svg { width: 100%; height: 26px; display: block; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.up-good, .down-good { color: var(--good); }
.up-bad, .down-bad { color: var(--bad); }

/* Panels */
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border-radius: var(--radius); padding: 14px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.panel-head h3 { font-size: 15px; font-weight: 700; }
.panel-head select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; flex: 0 1 260px; width: 260px; min-width: 0; max-width: 100%; }
.chart-box { position: relative; height: 290px; }
.chart-box.tall { height: 360px; }
.note { font-size: 12px; color: var(--ink-2); margin: 0; }
.empty { display: grid; place-items: center; min-height: 160px; color: var(--ink-2); text-align: center; padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--glass-line); border-radius: var(--radius); background: var(--glass-strong); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: inherit; }
thead th { background: var(--surface-2); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; user-select: none; }
tbody tr { background: transparent; }
th:first-child, td:first-child { background: var(--glass-strong); }
tbody tr.sel td:first-child { background: var(--accent-soft); }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); font-weight: 600; }
tbody tr.total { font-weight: 700; background: var(--surface-2); }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--font-ui); }
td.dim { color: var(--ink-2); }

/* Watchlist + findings */
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: var(--radius); padding: 8px 10px; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; color: var(--surface); }
.chip.good { background: var(--good); } .chip.warn { background: var(--warn); } .chip.bad { background: var(--bad); }
.list .fig { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.findings { margin: 0; padding: 14px 14px 14px 34px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--radius); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; gap: 8px; max-width: 110ch; }
.findings li { padding-left: 4px; }
.status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }

/* Sheets */
.sheet-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.sheet-tools input { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 8px; min-width: 0; width: min(320px, 100%); }
.sheet-table { max-height: 70vh; overflow: auto; }
.sheet-table table { font-size: 12px; }
.sheet-table th, .sheet-table td { text-align: left; border-right: 1px solid var(--line); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.sheet-table thead th { position: sticky; top: 0; z-index: 1; cursor: default; text-transform: none; letter-spacing: 0; }
.sheet-table td.rn, .sheet-table th.rn { color: var(--ink-2); background: var(--surface-2); text-align: right; }
.sheet-table td.n { text-align: right; }
mark { background: var(--cell); color: inherit; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; z-index: 20; }
.loading { padding: 60px 16px; text-align: center; color: var(--ink-2); }
footer { padding-block: 24px 40px; color: var(--ink-2); font-size: 12px; text-shadow: 0 0 12px var(--bg); }
@media (max-width: 600px) {
  .bar { position: relative; }
  .bar .wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
  .field.file { grid-column: 1 / -1; } .field.file select { min-width: 0; width: 100%; }
  .field select { width: 100%; }
  .spacer { display: none; }
  .bar .btn { text-align: center; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .val { font-size: 19px; } .chart-box { height: 240px; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.enter > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.kpi.enter-kpi { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 40ms); }
.val.flash { animation: flash .7s ease-out; }
@keyframes flash { 0% { text-shadow: 0 0 0 transparent; } 30% { text-shadow: 0 0 18px var(--glow); } 100% { text-shadow: 0 0 0 transparent; } }
::view-transition-old(root) { animation: vt-out .35s cubic-bezier(.4, 0, .2, 1) both; }
::view-transition-new(root) { animation: vt-in .55s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes vt-out { to { opacity: 0; transform: scale(.985); filter: blur(6px); } }
@keyframes vt-in { from { opacity: 0; transform: scale(1.015); filter: blur(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; } }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="bar">
  <div class="wrap">
    <div class="field file">
      <label for="selFile">Workbook</label>
      <select id="selFile"></select>
    </div>
    <div class="field">
      <label for="selMonth">📅 Month</label>
      <select id="selMonth"></select>
    </div>
    <div class="field">
      <label for="selEntity" id="lblEntity">🏫 School</label>
      <select id="selEntity"></select>
    </div>
    <div class="spacer"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabDash" aria-selected="true" data-view="dash">Dashboard</button>
      <button role="tab" id="tabSheets" aria-selected="false" data-view="sheets">Sheets</button>
    </div>
    <label class="btn" for="upload" title="Add another MIS workbook (.xlsx) to the Workbook list">Add workbook…</label>
    <input id="upload" type="file" accept=".xlsx,.xlsm,.xls" hidden multiple>
  </div>
</div>

<main class="wrap">
  <div id="loading" class="loading">Reading workbooks…</div>

  <div id="viewDash" hidden>
    <header class="head">
      <div class="eyebrow" id="hOrg"></div>
      <h1 id="hTitle"></h1>
      <p id="hSub"></p>
      <div class="showing" id="hShowing"></div>
      <div class="scene-cap" id="sceneCap" hidden><i></i><span id="sceneText"></span></div>
    </header>

    <section id="secKpis">
      <div class="section-title"><h2>Key figures</h2><span id="kpiNote">Select a tile to chart it below.</span></div>
      <div class="kpis" id="kpis"></div>
    </section>

    <section class="grid2" id="secCharts">
      <div class="panel">
        <div class="panel-head">
          <h3 id="trendTitle">Monthly trend</h3>
          <select id="selMetric" aria-label="Metric to chart"></select>
        </div>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
        <p class="note" id="trendNote"></p>
      </div>
      <div class="panel">
        <div class="panel-head"><h3 id="rankTitle">Ranking</h3></div>
        <div class="chart-box tall" id="rankBox"><canvas id="rankChart"></canvas></div>
        <p class="note" id="rankNote"></p>
      </div>
    </section>

    <section id="secScore">
      <div class="section-title"><h2 id="scoreTitle">Scorecard</h2><span>Select a row to drill into it. Select a heading to sort.</span></div>
      <div class="table-wrap"><table id="score"></table></div>
    </section>

    <section id="secStatus" hidden>
      <div class="status-grid" id="status"></div>
    </section>

    <section class="grid2" id="secNotes">
      <div>
        <div class="section-title"><h2>Watchlist</h2><span>Follows the month and selection</span></div>
        <ul class="list" id="watch"></ul>
      </div>
      <div>
        <div class="section-title"><h2>Data-quality findings</h2><span>As written in the workbook</span></div>
        <ol class="findings" id="findings"></ol>
      </div>
    </section>
    <footer id="sources"></footer>
  </div>

  <div id="viewSheets" hidden>
    <section>
      <div class="sheet-tools">
        <div class="field"><label for="selSheet">Sheet</label><select id="selSheet"></select></div>
        <div class="field" style="flex:1 1 220px"><label for="sheetFilter">Filter rows</label><input id="sheetFilter" type="search" placeholder="Type to show matching rows only"></div>
        <span class="note" id="sheetInfo"></span>
      </div>
    </section>
    <div class="table-wrap sheet-table"><table id="sheet"></table></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="mis-engine.js"></script>
<script src="scene3d.js"></script>
<script src="workbooks.js"></script>
<script>
(function () {
  'use strict';
  var E = window.MISEngine;
  var books = [];            // { id, label, model }
  var state = { book: 0, month: null, entity: '', focus: null, view: 'dash', sheet: 0, sortCol: null, sortDir: -1 };
  var charts = {};
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage (per-viewer convenience only) ----------
  function load(k) { try { return JSON.parse(localStorage.getItem('fm-mis:' + k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem('fm-mis:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }

  // ---------- formatting ----------
  var nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function isPct(m) { return /^%/.test(m.unit); }
  function fmt(v, m) {
    if (v === null || v === undefined || !isFinite(v)) return '–';
    if (m && isPct(m)) return nf1.format(v * 100) + '%';
    if (m && m.unit === 'ratio') return v.toFixed(3);
    var a = Math.abs(v);
    if (a >= 1000) return nf0.format(v);
    if (a >= 100 || Number.isInteger(v)) return nf0.format(v);
    if (a >= 10) return nf1.format(v);
    return nf2.format(v);
  }
  function unitOf(m) { return isPct(m) ? m.unit.replace(/^%\s*/, '') : (m.unit === 'ratio' ? '' : m.unit); }
  function pct(d) { return (d > 0 ? '+' : '') + Math.round(d * 100) + '%'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  // ---------- loading ----------
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function addBook(bytes, fileName) {
    var wb = XLSX.read(bytes, { type: 'array', cellDates: false });
    var model = E.parseWorkbook(XLSX, wb, fileName);
    var base = (model.org ? model.org + ' — ' : '') + (model.title.split('|')[0].trim() || fileName);
    var label = base.replace(/\s+/g, ' ');
    if (books.some(function (b) { return b.label === label; })) label += ' (' + fileName + ')';
    books.push({ id: fileName, label: label, model: model });
    return books.length - 1;
  }

  function init() {
    if (!window.XLSX || !E) { $('loading').textContent = 'The spreadsheet reader could not load. Check the internet connection and reload the page.'; return; }

  // ---------- dashboard ----------

  // Reference value for comparisons: a target, Avg 2025, or this year's monthly average.

  function sparkline(arr, idx) {

  // ---------- motion ----------

  function chartDefaults() {

  function renderTrend(m) {

  function renderScore(m) {

      cols.push({ id: k, label: mt.label.replace(/\s*\(.*\)/, '') + (unitOf(mt) ? ' (' + unitOf(mt) + ')' : ''), mt: mt, get: function (e) { return E.valueOf(m, mt, state.month, e); } });
      if (m.layout === 'campus') {
        cols.push({ id: k + ':share', label: 'Share', pct: true, get: function (e) { var v = E.valueOf(m, mt, state.month, e), t = E.valueOf(m, mt, state.month, null); return v !== null && t ? v / t : null; } });
        if (state.month !== 'ytd') cols.push({ id: k + ':ytd', label: 'YTD', mt: mt, get: function (e) { return E.valueOf(m, mt, 'ytd', e); } });
      }
    });
    var rows = m.entities.slice();
    if (state.sortCol) {
      var c = cols.find(function (x) { return x.id === state.sortCol; });
      if (c) rows.sort(function (a, b) {
        var va = c.get(a), vb = c.get(b);
        if (c.text) return String(va).localeCompare(String(vb)) * -state.sortDir;
        return ((va === null ? -Infinity : va) - (vb === null ? -Infinity : vb)) * state.sortDir;
      });
    }
    function cell(c, e) {
      var v = c.get(e);
      if (c.text) return '<td class="dim">' + esc(v) + '</td>';
      if (c.pct) return '<td class="dim">' + (v === null ? '–' : nf1.format(v * 100) + '%') + '</td>';
      return '<td' + (v === null ? ' class="dim"' : '') + '>' + fmt(v, c.mt) + '</td>';
    }
    var head = '<thead><tr><th data-col="">' + esc(m.entityLabel) + '</th>' + cols.map(function (c) {
      return '<th data-col="' + c.id + '" aria-sort="' + (state.sortCol === c.id ? (state.sortDir < 0 ? 'descending' : 'ascending') : 'none') + '">' + esc(c.label) + (state.sortCol === c.id ? (state.sortDir < 0 ? ' ▼' : ' ▲') : '') + '</th>';
    }).join('') + '</tr></thead>';
    var body = rows.map(function (e) {
      return '<tr data-ent="' + esc(e) + '"' + (e === state.entity ? ' class="sel"' : '') + '><td>' + esc(e) + '</td>' + cols.map(function (c) { return cell(c, e); }).join('') + '</tr>';
    }).join('');
    var total = '<tr class="total" data-ent=""><td>' + esc(m.layout === 'campus' ? 'Metered facilities' : m.allLabel) + '</td>' + cols.map(function (c) {
      if (c.text) return '<td></td>';
      if (c.pct) return '<td class="dim">100%</td>';
      return '<td>' + fmt(c.id.indexOf(':ytd') > 0 ? E.valueOf(m, c.mt, 'ytd', null) : E.valueOf(m, c.mt, state.month, null), c.mt) + '</td>';
    }).join('') + '</tr>';
    $('score').innerHTML = head + '<tbody>' + body + total + '</tbody>';
    $('secScore').hidden = !m.entities.length;
  }

  function renderStatus(m) {
    $('secStatus').hidden = !m.statusTables.length;
    $('status').innerHTML = m.statusTables.map(function (t) {
      var ents = [''].concat(m.entities);
      return '<div><div class="section-title"><h2>' + esc(t.title) + '</h2><span>' + esc(t.note) + '</span></div><div class="table-wrap"><table><thead><tr><th>' + (t.code === 'F' ? 'Status' : 'Measure') + '</th><th>' + esc(state.entity || m.allLabel) + '</th></tr></thead><tbody>' +
        t.rows.map(function (r) {
          var v = state.entity ? r.values[state.entity] : r.values.__total;
          return '<tr><td>' + esc(r.label) + '</td><td>' + (v === null || v === undefined ? '–' : nf0.format(v)) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }).join('');
  }

  function renderWatch(m) {
    var items = [];
    cardKeys(m).forEach(function (k) {
      var mt = m.metrics[k], ent = entityFor(mt);
      var v = E.valueOf(m, mt, state.month, ent);
      if (v === null) return;
      var a = assess(m, mt, v);
      if (a.target) items.push({ s: a.target.meets ? 'good' : 'bad', t: mt.label + ' vs ' + a.target.text.toLowerCase().replace(/ ·.*$/, ''), f: fmt(v, mt) + ' ' + unitOf(mt) });
      else if (a.delta && mt.good) items.push({ s: a.state === 'neutral' ? 'good' : a.state, t: mt.label + ' vs ' + a.delta.label, f: pct(a.delta.d) });
    });
    if (m.coverage && state.month !== 'ytd') {
      [['grid', 'electricity'], ['water', 'water']].forEach(function (p) {
        var cov = m.coverage[p[0]];
        if (!cov) return;
        var missing = m.entities.length - (cov[state.month] || 0);
        items.push({ s: missing > 0 ? 'warn' : 'good', t: 'Schools yet to report ' + p[1] + ' for ' + m.months[state.month], f: String(missing) });
      });
    }
    var order = { bad: 0, warn: 1, good: 2 };
    items.sort(function (a, b) { return order[a.s] - order[b.s]; });
    var word = { bad: 'Act', warn: 'Check', good: 'OK' };
    $('watch').innerHTML = items.map(function (i) { return '<li><span class="chip ' + i.s + '">' + word[i.s] + '</span><span>' + esc(i.t) + '</span><span class="fig">' + esc(i.f) + '</span></li>'; }).join('') || '<li><span></span><span>No comparisons available for this selection.</span><span></span></li>';
  }

  // ---------- sheet viewer ----------
  function colName(i) { var s = ''; i++; while (i > 0) { var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
  function renderSheet() {
    var m = model();
    var sh = m.sheets[state.sheet];
    if (!sh) { $('sheet').innerHTML = ''; return; }
    var q = $('sheetFilter').value.trim().toLowerCase();
    var rows = sh.rows;
    var width = 0;
    rows.forEach(function (r) { for (var c = r.length - 1; c >= 0; c--) if (r[c] !== '' && r[c] !== null) { width = Math.max(width, c + 1); break; } });
    var shown = [];
    rows.forEach(function (r, i) {
      var has = r.some(function (v) { return v !== '' && v !== null; });
      if (!has) return;
      if (q && !r.some(function (v) { return String(v).toLowerCase().indexOf(q) >= 0; })) return;
      shown.push(i);
    });
    var limit = 1500;
    var head = '<thead><tr><th class="rn">#</th>';
    for (var c = 0; c < width; c++) head += '<th>' + colName(c) + '</th>';
    head += '</tr></thead>';
    var hl = function (s) {
      var e = esc(s);
      if (!q) return e;
      var i = e.toLowerCase().indexOf(esc(q));
      return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length);
    };
    var body = shown.slice(0, limit).map(function (i) {
      var r = rows[i], tds = '<td class="rn">' + (i + 1) + '</td>';
      for (var c = 0; c < width; c++) {
        var v = r[c] === undefined || r[c] === null ? '' : String(r[c]);
        tds += '<td' + (/^[-₹]?[\d,.]+%?$/.test(v) ? ' class="n"' : '') + ' title="' + esc(v) + '">' + hl(v) + '</td>';
      }
      return '<tr>' + tds + '</tr>';
    }).join('');
    $('sheet').innerHTML = head + '<tbody>' + body + '</tbody>';
    $('sheetInfo').textContent = shown.length + ' of ' + rows.filter(function (r) { return r.some(function (v) { return v !== '' && v !== null; }); }).length + ' rows · ' + width + ' columns' + (shown.length > limit ? ' · first ' + limit + ' shown' : '');
  }

  // ---------- events ----------
  $('selFile').addEventListener('change', function (e) { var v = +e.target.value; transition(function () { selectBook(v, null); }); });
  $('selMonth').addEventListener('change', function (e) { state.month = e.target.value === 'ytd' ? 'ytd' : +e.target.value; render(); });
  $('selEntity').addEventListener('change', function (e) { state.entity = e.target.value; render(); });
  $('selMetric').addEventListener('change', function (e) { state.focus = e.target.value; render(); });
  $('kpis').addEventListener('click', function (e) { var b = e.target.closest('.kpi'); if (b) { state.focus = b.dataset.key; render(); } });
  $('score').addEventListener('click', function (e) {
    var th = e.target.closest('th');
    if (th) {
      var col = th.dataset.col || null;
      if (state.sortCol === col) state.sortDir = -state.sortDir; else { state.sortCol = col; state.sortDir = -1; }
      render(); return;
    }
    var tr = e.target.closest('tr[data-ent]');
    if (tr) { state.entity = tr.dataset.ent === state.entity ? '' : tr.dataset.ent; $('selEntity').value = state.entity; render(); }
  });
  document.querySelector('.tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-view]'); if (b && !b.disabled && b.dataset.view !== state.view) transition(function () { setView(b.dataset.view); }); });
  $('selSheet').addEventListener('change', function (e) { state.sheet = +e.target.value; render(); });
  var ft;
  $('sheetFilter').addEventListener('input', function () { clearTimeout(ft); ft = setTimeout(renderSheet, 150); });
  $('upload').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    var last = null;
    var pending = files.length;
    files.forEach(function (f) {
      var r = new FileReader();
      r.onload = function () {
        try {
          last = addBook(new Uint8Array(r.result), f.name);
          var mm = books[last].model;
          toast('Added ' + f.name + (mm.layout === 'sheets' ? ' — no MIS_Calc sheet found, so only the sheet viewer is available' : ''));
        } catch (err) { console.error(err); toast('Could not read ' + f.name + '. Save it as .xlsx and try again.'); }
        if (--pending === 0 && last !== null) { fillFileSelect(); $('selFile').value = String(last); selectBook(last, null); }
      };
      r.readAsArrayBuffer(f);
    });
    e.target.value = '';
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (books.length) render(); });
  }
  new MutationObserver(function () { if (books.length) render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  init();
})();
</script>
</body>
</html>
