<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP Maintenance</title>
<style>
/* Layout: wireframe shell. Green brand bar on top, grey navigation rail on the left (a bottom tab bar on phones), work area on the right. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eef2f0;
  --ink: #16201b;
  --ink-2: #56635c;
  --ink-3: #85918b;
  --line: #d8dfdb;
  --brand: #0d7a4c;
  --brand-ink: #ffffff;
  --brand-soft: #dff1e7;
  --bar: #e3f1e9;
  --rail: #e9edeb;
  --red: #c2342d;   --red-soft: #fbe6e4;
  --orange: #b96300; --orange-soft: #fcefdc;
  --green: #1d8549; --green-soft: #e1f3e8;
  --grey: #66706b;  --grey-soft: #eceeed;
  --blue: #2361c2;  --blue-soft: #e4ecfa;
  --shadow: 0 1px 2px rgba(20, 40, 30, .06), 0 6px 18px -10px rgba(20, 40, 30, .18);
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2724; --ink: #e6eeea; --ink-2: #a2b1aa; --ink-3: #75847d; --line: #2a3632;
    --brand: #39b07b; --brand-ink: #06120c; --brand-soft: #173a2a; --bar: #13241c; --rail: #131b18;
    --red: #ff7a70; --red-soft: #3a1b19; --orange: #f2a54a; --orange-soft: #3a2a14; --green: #5fd18f; --green-soft: #15301f;
    --grey: #a7b2ad; --grey-soft: #242e2a; --blue: #7aa8ff; --blue-soft: #1a2640; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2724; --ink: #e6eeea; --ink-2: #a2b1aa; --ink-3: #75847d; --line: #2a3632;
  --brand: #39b07b; --brand-ink: #06120c; --brand-soft: #173a2a; --bar: #13241c; --rail: #131b18;
  --red: #ff7a70; --red-soft: #3a1b19; --orange: #f2a54a; --orange-soft: #3a2a14; --green: #5fd18f; --green-soft: #15301f;
  --grey: #a7b2ad; --grey-soft: #242e2a; --blue: #7aa8ff; --blue-soft: #1a2640; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 100%; }
.bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px; background: var(--bar); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 32px; height: 32px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 18px; height: 18px; }
.brand b { font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; color: var(--brand); white-space: nowrap; }
.brand span { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.bar .grow { flex: 1 1 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.pill.live i { background: var(--green); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 14px;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--ink);
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); color: var(--brand-ink); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn svg { width: 16px; height: 16px; }
a.btn { text-decoration: none; }
fieldset.q { min-width: 0; }
fieldset.q legend { float: left; width: 100%; padding: 0; margin: 0 0 10px; }
fieldset.q .seg { clear: both; }
.btn.icon { padding: 8px; min-width: 40px; }

.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; }
.rail a {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: var(--r); color: var(--ink-2);
  text-decoration: none; font-weight: 600; border: 1px solid transparent;
}
.rail a svg { width: 18px; height: 18px; flex: none; }
.rail a:hover { background: var(--surface); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--surface); color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); box-shadow: var(--shadow); }
.rail .foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 10px 12px 0; line-height: 1.5; }

main { padding: 24px clamp(16px, 3vw, 32px) 40px; min-width: 0; }
.view { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; justify-content: space-between; }
.view-head h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -.01em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.sub { color: var(--ink-2); margin: 2px 0 0; }

/* ---------- filters ---------- */
.filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field select, .field input, .field textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
}
.field textarea { min-height: 90px; resize: vertical; }

/* ---------- status cards ---------- */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.stat {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--ink)); border-radius: var(--r);
  padding: 14px 14px 12px; display: grid; gap: 2px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
}
button.stat:hover { transform: translateY(-2px); }
.stat[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 9%, var(--surface)); box-shadow: 0 0 0 2px var(--c); }
.stat .v { font-family: var(--font-num); font-size: 28px; font-weight: 600; color: var(--c, var(--ink)); line-height: 1.1; }
.stat .k { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.c-total { --c: var(--ink); } .c-overdue { --c: var(--red); } .c-due { --c: var(--orange); } .c-ok { --c: var(--green); } .c-nc { --c: var(--grey); } .c-comp { --c: var(--blue); }

.banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--orange-soft); border: 1px solid color-mix(in srgb, var(--orange) 35%, transparent); color: var(--ink); }
.banner.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.banner svg { width: 20px; height: 20px; color: var(--orange); flex: none; }
.banner.ok svg { color: var(--green); }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-overdue { color: var(--red); background: var(--red-soft); }
.s-due { color: var(--orange); background: var(--orange-soft); }
.s-ok { color: var(--green); background: var(--green-soft); }
.s-nc { color: var(--grey); background: var(--grey-soft); }

/* ---------- table ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card > header h2 { font-size: 17px; font-weight: 700; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { background: var(--blue-soft); color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
thead th button { all: unset; cursor: pointer; }
thead th button:focus-visible { outline: 2px solid var(--brand); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td.id { font-family: var(--font-num); font-weight: 600; white-space: nowrap; }
td.go { text-align: right; color: var(--brand); font-weight: 700; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; color: var(--ink-2); font-size: 13.5px; }
.pager .btns { display: flex; gap: 8px; }
.empty { padding: 36px 20px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty b { color: var(--ink); font-size: 16px; }

/* ---------- asset cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.acard:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
.acard .sys { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); }
.acard h3 { font-size: 18px; font-weight: 700; }
.acard .meta { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.acard .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }

/* ---------- detail ---------- */
.back { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.summary { padding: 16px; display: grid; gap: 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 18px; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv dt { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.tabs button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 12px 8px; font-weight: 600; color: var(--ink-2); min-height: 48px; }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--brand-soft); color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; }
.checklist li { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist .box { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 5px; flex: none; margin-top: 1px; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.checklist .box.pass { border-color: var(--green); color: var(--green); }
.checklist .box.fail { border-color: var(--red); color: var(--red); }
.note { font-size: 13px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px; border-top: 1px solid var(--line); }
.hist { display: grid; }
.hist .h { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.hist .h:last-child { border-bottom: 0; }
.hist img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }

/* ---------- mobile check ---------- */
.checkform { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.q.err { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.q h3 { font-size: 15px; font-family: var(--font-body); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: grid; place-items: center; min-height: 46px; border: 1.5px solid var(--line); border-radius: var(--r); font-weight: 700; background: var(--surface); cursor: pointer; transition: background .12s, border-color .12s; }
.seg input:focus-visible + label { outline: 2px solid var(--brand); outline-offset: 2px; }
.seg input[value="Pass"]:checked + label { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.seg input[value="Fail"]:checked + label { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.seg input[value="N/A"]:checked + label { background: var(--grey-soft); border-color: var(--grey); color: var(--ink); }
.photo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.photo img { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.err-msg { color: var(--red); font-weight: 600; font-size: 13.5px; }
.done { text-align: center; padding: 28px 18px; display: grid; gap: 12px; justify-items: center; }
.done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.done .tick svg { width: 32px; height: 32px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- data panel ---------- */
.dlg { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 15, .45); display: grid; place-items: center; padding: 16px; }
.dlg .card { width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.dlg .body { padding: 16px; display: grid; gap: 14px; }
.dlg .body p { margin: 0; color: var(--ink-2); font-size: 14px; }
.dlg .row { display: flex; flex-wrap: wrap; gap: 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }


/* ---------- QR ---------- */
.qr svg { display: block; width: 100%; height: auto; }
.qr-card { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px; }
.qr-card .qr { background: #fff; padding: 8px; border-radius: 6px; border: 1px solid var(--line); }
.qr-card .link { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.labels { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px; }
.label {
  background: #fff; color: #111; border: 1px dashed #b9c3be; border-radius: 6px; padding: 10px;
  display: grid; grid-template-columns: var(--qr, 96px) minmax(0, 1fr); gap: 10px; align-items: center; break-inside: avoid; page-break-inside: avoid;
}
.label .t { display: grid; gap: 2px; min-width: 0; }
.label .org { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0d7a4c; }
.label .id { font-family: var(--font-num); font-weight: 600; font-size: 16px; }
.label .nm { font-weight: 600; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.label .mt { font-size: 11px; color: #555; line-height: 1.3; }
.label .cta { font-size: 10px; color: #555; margin-top: 2px; }
.size-s { --cols: 4; --qr: 72px; } .size-s .label .nm { font-size: 11.5px; } .size-s .label .id { font-size: 13px; }
.size-m { --cols: 3; --qr: 96px; }
.size-l { --cols: 2; --qr: 140px; } .size-l .label .nm { font-size: 15px; } .size-l .label .id { font-size: 19px; }
.cam { position: relative; background: #000; border-radius: var(--r); overflow: hidden; aspect-ratio: 3 / 4; max-height: 62vh; width: 100%; max-width: 100%; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .frame { position: absolute; inset: 18%; border: 3px solid rgba(255, 255, 255, .9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
.cam .scanline { position: absolute; left: 18%; right: 18%; height: 2px; background: var(--brand); top: 18%; animation: scan 2.2s ease-in-out infinite; box-shadow: 0 0 12px var(--brand); }
@keyframes scan { 0%, 100% { top: 20%; } 50% { top: 80%; } }
.scanwrap { max-width: 520px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
@media (max-width: 760px) { .labels { --cols: 1 !important; } .size-s .labels, .labels { grid-template-columns: repeat(min(var(--cols), 2), minmax(0, 1fr)); } .qr-card { grid-template-columns: 96px minmax(0, 1fr); } }
@media print {
  @page { margin: 10mm; }
  body { background: #fff !important; }
  .bar, .rail, .no-print, .toast, .dlg { display: none !important; }
  .app { display: block; }
  main { padding: 0 !important; }
  .view { animation: none; max-width: none; gap: 0; }
  .labels { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)) !important; gap: 6mm; }
  .label { border-color: #999; }
}

/* ---------- responsive ---------- */
@media (max-width: 1000px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .rail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; flex-direction: row; justify-content: space-around; gap: 2px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line);
  }
  .rail a { flex: 1 1 0; flex-direction: column; gap: 3px; padding: 7px 4px; font-size: 11.5px; text-align: center; }
  .rail .foot { display: none; }
  .rail a[data-nav="labels"], .rail a[data-nav="asset"] { display: none; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters .field:last-child { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand span { display: none; }
  #userName { display: none; }
  .bar { flex-wrap: nowrap; padding-inline: 14px; }
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs button:nth-child(2) { border-right: 0; }
  .tabs button:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/></svg></span>
      <b>AKA</b><span>Facilities &amp; maintenance</span>
    </div>
    <div class="grow"></div>
